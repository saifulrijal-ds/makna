  outcome: answer
  expected:
    metrics: [disbursement_amount]
    request:
      metric: disbursement_amount
      dimensions: [branch.region_name]
      time_start: "2026-01-01"
      time_end: "2026-07-01"
    answer_columns: [branch__region_name, disbursement_amount]
  notes: "Indonesian synonym; region through the booking branch."

