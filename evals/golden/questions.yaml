# Golden question set (EVL-1). Shape: docs/EVALS.md section 2.2; model: evals/golden/schema.py.
# Today is 2026-07-01 in every question. G01 to G20 are the first 20 of docs/EVALS.md 2.5.
# `group` is the composition group of docs/EVALS.md 2.4. A question with no time phrase has a
# request with no time range: the latest month end for a balance metric, all data for a flow.

# ---- G01 to G20: the first 20 questions (docs/EVALS.md 2.5), unchanged ----

- id: G01
  question: "How much did we disburse in June 2026?"
  language: en
  group: direct_english
  tags: [direct, official_date, exclusion]
  outcome: answer
  expected:
    metrics: [disbursement_amount]
    request:
      metric: disbursement_amount
      time_start: "2026-06-01"
      time_end: "2026-07-01"
    answer_columns: [disbursement_amount]
  notes: "Disbursement date, not signing date; cancelled contracts excluded."

- id: G02
  question: "Total pencairan tahun ini untuk tiap wilayah?"
