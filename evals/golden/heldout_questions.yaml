# The held-out retrieval questions (EVL-1, EVL-2, SRC-2; WP-14C, decision D-32 (5) and D-34).
# Shape: evals/golden/heldout.py (`HeldoutQuestion`); rules: docs/EVALS.md section 3.2.
#
# NEVER TUNE ON THESE. They exist to measure how search does on questions that nobody tuned the
# weights, the synonyms, or the confidence thresholds against. The tuning code (`evals/tune.py`)
# cannot read this file, and a unit test keeps it so. If you read the numbers of this split and
# then change a weight to make them better, the split is spent: say so in the pull request and
# ask for new questions.
#
# They expect a metric only and have no reference SQL: the compile eval never reads them.
# The text below the header is the file as the author delivered it; the questions are not edited.
provenance: Written 2026-11-16 by a fresh agent that never read the repository, from the business meanings of the 23 approved metrics with names, labels and synonyms removed and the metrics behind shuffled codes (D-32 (5) fallback, D-34). Weaker than questions written by a person. Never tune on these.
