  en: [DPD, days overdue, delinquency days, arrears days]
  id: [hari keterlambatan, tunggakan, hari tunggakan, umur tunggakan]
version: 1
related: [entity:contract_snapshot, metric:npf_ratio, metric:par30_ratio]
