apiVersion: makna/v1
kind: entity
name: branch
label: Branch
description: >-
  A branch office. Branches roll up to areas and areas roll up to regions.
  A contract is linked to a branch in two ways (booking and servicing), so
  metrics state which link they use.
domain: lending
owner: {team: data-governance}
status: approved
sensitivity: internal
synonyms:
  en: [office, outlet]
  id: [cabang, kantor cabang]
version: 1
source: {table: lending.core.branches}
primary_key: [branch_id]
dimensions:
  - name: branch_code
    type: categorical
    description: Short code that identifies the branch office, for example BDG01.
    synonyms: {en: [branch code, office code], id: [kode cabang, kode kantor]}
  - name: branch_name
    type: categorical
    description: Name of the branch office.
    synonyms: {en: [branch], id: [cabang, nama cabang]}
  - name: area_name
    type: categorical
    description: Area the branch belongs to. An area groups several branches.
    synonyms: {en: [area], id: [area, kawasan]}
  - name: region_name
    type: categorical
    description: Sales region the branch belongs to. A region groups several areas and can span several provinces, so it is not the same as a province.
    synonyms: {en: [region], id: [wilayah, regional]}
    values:
      - {value: Jawa Barat}
      - {value: Jawa Tengah}
      - {value: Jawa Timur}
      - {value: Sumatera}
      - {value: Kalimantan Sulawesi}
  - name: province
    type: categorical
    description: Administrative province where the branch office is located. Not the same as the sales region.
    synonyms: {id: [provinsi]}
  - name: is_active
    type: boolean
    description: False for branches that have closed. Closed branches still appear on old contracts.
    synonyms: {en: [open branch, active branch], id: [cabang aktif, cabang masih beroperasi]}
