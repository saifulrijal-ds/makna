apiVersion: makna/v1
kind: metric
name: application_count
label: Application Count
description: >-
  Number of financing applications submitted in a period, counted on the date
  the customer submitted them, whatever the outcome.
domain: lending
owner: {team: sales-performance, contact: sales-performance@example.com}
status: approved
sensitivity: internal
synonyms:
  en: [applications, number of applications, application volume, applications received]
  id: [jumlah pengajuan, jumlah permohonan, pengajuan pembiayaan, aplikasi masuk]
version: 1
type: simple
measure: application.submitted_applications
join_paths:
  branch: [application.branch]
format: {kind: count, unit: applications, decimals: 0}
default_grain: month
example_questions:
  - How many applications did we receive last month?
  - Berapa jumlah pengajuan per saluran bulan ini?
example_requests:
  - question: "Applications submitted each month of the second quarter of 2026, by channel"
    request: {dimensions: [application.channel], grain: month, time_start: "2026-04-01", time_end: "2026-07-01"}
caveats: >-
  Counts every application by submission date, including rejected, withdrawn,
  and in-process ones. Reported by the branch that received the application.
