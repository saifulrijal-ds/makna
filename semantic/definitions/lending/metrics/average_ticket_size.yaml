apiVersion: makna/v1
kind: metric
name: average_ticket_size
label: Average Ticket Size
description: >-
  Average principal per disbursed contract in a period: disbursement amount
  divided by the number of disbursed contracts.
domain: lending
owner: {team: sales-performance, contact: sales-performance@example.com}
status: approved
sensitivity: internal
synonyms:
  en: [average loan size, average financing amount, average disbursement per contract]
  id: [rata-rata plafon, rata-rata nilai pembiayaan, rata-rata pencairan per kontrak]
version: 1
type: ratio
numerator: disbursement_amount
denominator: disbursed_contract_count
format: {kind: currency, unit: IDR, decimals: 0}
default_grain: month
example_questions:
  - What is the average loan size by product category?
  - Berapa rata-rata plafon pembiayaan per wilayah semester ini?
example_requests:
  - question: "Average ticket size by region in the first half of 2026"
    request: {dimensions: [branch.region_name], time_start: "2026-01-01", time_end: "2026-07-01"}
caveats: Uses the disbursement date. Cancelled contracts are in neither side. Reported by booking branch.
