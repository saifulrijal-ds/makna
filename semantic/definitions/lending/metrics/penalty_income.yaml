apiVersion: makna/v1
kind: metric
name: penalty_income
label: Penalty Income
description: >-
  Late payment penalties received from customers in a period, counted on the
  date the payment was booked. Penalties on reversed payments are excluded.
domain: lending
owner: {team: collection, contact: collection@example.com}
status: approved
sensitivity: internal
synonyms:
  en: [late fees, penalties collected, late payment penalty, late charges]
  id: [pendapatan denda, denda keterlambatan, denda terkumpul, penerimaan denda]
version: 1
type: simple
measure: payment.penalty_received
join_paths:
  branch: [payment.contract, contract.servicing_branch]
format: {kind: currency, unit: IDR, decimals: 0}
default_grain: month
example_questions:
  - How much did we earn from late fees last quarter?
  - Berapa total denda keterlambatan yang diterima per cabang?
example_requests:
  - question: "Penalties received each month of the first half of 2026, by payment channel"
    request: {dimensions: [payment.payment_channel], grain: month, time_start: "2026-01-01", time_end: "2026-07-01"}
caveats: Uses the posting date, not the date the customer paid. Reported by servicing branch.
