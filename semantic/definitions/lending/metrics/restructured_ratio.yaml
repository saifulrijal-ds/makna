apiVersion: makna/v1
kind: metric
name: restructured_ratio
label: Restructured Ratio
description: >-
  Share of outstanding principal that sits in restructured contracts at a
  month end. Contracts that leave the book at that month end (more than 210
  days past due) are left out of both parts.
domain: lending
owner: {team: credit-risk, contact: credit-risk@example.com}
status: approved
sensitivity: internal
synonyms:
  en: [restructuring ratio, share of restructured loans, restructured portfolio share]
  id: [rasio restrukturisasi, persentase restrukturisasi, porsi kredit direstrukturisasi]
version: 1
type: ratio
numerator: restructured_outstanding_principal
denominator: outstanding_principal
format: {kind: percent, decimals: 2}
time_grains: [month, quarter, year]
default_grain: month
example_questions:
  - Which region has the highest share of restructured loans?
  - Berapa rasio restrukturisasi di akhir kuartal terakhir?
example_requests:
  - question: "Restructured share of the portfolio by region, quarter by quarter, from Q4 2025"
    request: {dimensions: [branch.region_name], grain: quarter, time_start: "2025-10-01", time_end: "2026-07-01"}
caveats: >-
  Gross ratio based on principal. The restructured flag is the contract's current
  one, so positions before the restructuring date of a contract that was
  restructured later are counted as restructured too. Available at month ends
  only. Reported by servicing branch.
