# Example 2 of 3: a ratio metric.
apiVersion: makna/v1
kind: metric
name: npf_ratio
label: NPF Ratio
description: >-
  Share of outstanding principal that is non-performing at a month end:
  principal owed on contracts more than 90 days past due, divided by all
  outstanding principal. Positions written off at that month end (more than
  210 days past due) are in neither part. In everyday use "kredit macet" means
  this measure (more than 90 days past due); the collectibility class "Macet"
  is class 5 only, more than 180 days.
domain: lending
owner: {team: credit-risk, contact: credit-risk@example.com}
status: approved
sensitivity: internal
synonyms:
  en: [NPF, non-performing financing ratio, NPL ratio, bad debt ratio]
  id: [rasio NPF, kredit macet, rasio pembiayaan bermasalah, rasio kredit bermasalah]
version: 1
type: ratio
numerator: npf_outstanding_principal
denominator: outstanding_principal
format: {kind: percent, decimals: 2}
time_grains: [month, quarter, year]
default_grain: month
example_questions:
  - What is our NPF?
  - Berapa rasio kredit macet per wilayah bulan lalu?
  - NPF ratio trend for car-backed financing in 2026
example_requests:
  - question: "Rasio NPF per wilayah setiap kuartal dari Q4 2025 sampai Q2 2026"
    request: {dimensions: [branch.region_name], grain: quarter, time_start: "2025-10-01", time_end: "2026-07-01"}
caveats: >-
  Gross ratio based on principal; provisions are not deducted. Reported by
  servicing branch. Restructured contracts are included according to their
  current days past due. Contracts written off at the month end are left out
  of the numerator and the denominator.
