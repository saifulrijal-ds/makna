# Example 3 of 3: a metric that needs a non-obvious join path.
#
# The two sides come from different tables (payments and installment
# schedules), so they are aggregated separately and never joined row to row.
# Each side reaches `branch` through contract, where four links to a branch
# exist (booking branch, servicing branch, the customer's home branch, and the
# application branch). The input metrics pin the servicing branch, so
# "collection rate by region" means the region of the branch that collects.
apiVersion: makna/v1
kind: metric
name: collection_rate
label: Collection Rate
description: >-
  Amount collected in a period divided by the amount that fell due in the
  same period. A value above 100% means customers paid arrears or paid early.
domain: lending
owner: {team: collection, contact: collection@example.com}
status: approved
sensitivity: internal
synonyms:
  en: [collection ratio, repayment rate, collection effectiveness]
  id: [tingkat penagihan, rasio penagihan, collection ratio, tingkat kolektibilitas tagihan]
version: 1
type: ratio
numerator: collected_amount
denominator: due_amount
format: {kind: percent, decimals: 2}
default_grain: month
example_questions:
  - What was the collection rate by region last quarter?
  - Berapa tingkat penagihan cabang bulan ini?
caveats: >-
  Collections are dated by posting date and dues by due date, so a payment
  for an old installment counts in the month it is booked. Reported by
  servicing branch.
