# A new entity. Fill in every field that is empty (""). The comments help you here; Makna
# stores the definition in its own canonical form, so comments and key order are not kept.
apiVersion: makna/v1
kind: entity
name: ""          # lowercase letters, digits and underscores, starting with a letter
label: ""         # the name people use in a sentence
description: ""   # what one row stands for, in plain language (at least 20 characters)
domain: ""        # the name of an existing domain
owner:
  team: ""        # the team that owns this entity
status: draft
sensitivity: internal
synonyms:
  en: []          # other English names people use for it
  id: []          # other Indonesian names people use for it
source: {table: ""}   # catalog.schema.table
primary_key: []   # the column or columns that identify one row
dimensions:
  - name: ""      # lowercase letters, digits and underscores
    type: categorical   # categorical, time, boolean or numeric
    description: ""     # what the dimension tells you (at least 10 characters)
