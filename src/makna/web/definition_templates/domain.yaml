# A new domain. Fill in every field that is empty (""). The comments help you here; Makna
# stores the definition in its own canonical form, so comments and key order are not kept.
apiVersion: makna/v1
kind: domain
name: ""          # lowercase letters, digits and underscores, starting with a letter
label: ""         # the name people use in a sentence
description: ""   # what this area of the business covers (at least 20 characters)
owner:
  team: ""        # the team that owns this domain
status: draft
sensitivity: internal
