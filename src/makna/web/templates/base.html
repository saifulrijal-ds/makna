<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval": false, "includeIndicatorStyles": false}'>
  <title>{% block title %}Makna{% endblock %} - Makna</title>
  <link rel="stylesheet" href="/static/vendor/pico/pico.classless.min.css">
  <link rel="stylesheet" href="/static/makna.css">
  <script src="/static/vendor/htmx/htmx.min.js" defer></script>
</head>
<body{% if csrf_token %} hx-headers='{{ {"X-CSRF-Token": csrf_token} | tojson }}'{% endif %}>
  <header>
    <nav aria-label="Main">
      <ul>
        <li><strong>Makna</strong></li>
      </ul>
      <ul>
        {% for label, path in nav %}
        <li><a href="{{ path }}">{{ label }}</a></li>
        {% endfor %}
        {% if caller %}
        <li>
          <form method="post" action="/logout" class="inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="secondary">Sign out</button>
          </form>
        </li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
