{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}
<p role="alert"><mark>{{ error }}</mark></p>
{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Email
    <input type="email" name="email" value="{{ email }}" autocomplete="username" maxlength="254" required autofocus>
  </label>
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
