glossary_terms:
- {catalog_id: glossary.npf, name: NPF, definition: Financing more than 90 days past due., synonyms: [non-performing financing, non-performing loan, kredit macet]}
- {catalog_id: glossary.days_past_due, name: Days past due, definition: Days since the oldest unpaid installment fell due., synonyms: [DPD, hari keterlambatan, tunggakan]}
- {catalog_id: glossary.collectibility, name: Collectibility, definition: 'Credit quality class of a contract, from 1 (current) to 5 (loss).', synonyms: [kolektibilitas, kol]}
- {catalog_id: glossary.disbursement, name: Disbursement, definition: Release of the approved financing amount to the customer., synonyms: [pencairan, drawdown]}
- {catalog_id: glossary.restructuring, name: Restructuring, definition: Replacement of the remaining repayment schedule of a contract by an easier one., synonyms: [restrukturisasi, rescheduling]}
- {catalog_id: glossary.outstanding, name: Outstanding principal, definition: Principal still owed on a contract., synonyms: [baki debet, sisa pokok, outstanding balance]}
- {catalog_id: glossary.tenor, name: Tenor, definition: Number of months over which a contract is repaid., synonyms: [loan term, jangka waktu]}
- {catalog_id: glossary.portfolio_at_risk, name: Portfolio at risk, definition: Share of the portfolio that is past due beyond a stated number of days., synonyms: [PAR, portofolio berisiko]}
