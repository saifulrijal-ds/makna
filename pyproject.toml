[project]
name = "makna-sl"
version = "0.1.0"
description = "Makna: an open semantic layer platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0.3",
    "sqlglot>=30.31.0",
]

[project.scripts]
makna = "makna.cli.main:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261111",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "makna"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: needs nothing but Python (DuckDB in process)",
    "integration: needs PostgreSQL with pgvector (MAKNA_TEST_DATABASE_URL)",
    "engine: needs the generated sample data in PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["makna.model", "makna.model.*", "makna.compiler", "makna.compiler.*"]
strict = true
