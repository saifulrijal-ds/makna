name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m unit

  integration:
    name: Integration tests (PostgreSQL with pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Keep this tag equal to the one in deploy/docker-compose.yml.
        image: pgvector/pgvector:0.8.0-pg17
        env:
          # Throwaway password of this job's own database container; it holds no real data.
          POSTGRES_PASSWORD: makna_dev_postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MAKNA_TEST_DATABASE_URL: postgresql://postgres:makna_dev_postgres@localhost:5432/postgres
      # A missing database must fail this job, never skip every test.
      MAKNA_REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m integration

  stack:
    name: Development stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Generate a throwaway application secret
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "MAKNA_SECRET_KEY=$key" >> "$GITHUB_ENV"
      - name: Start the stack (acceptance 1)
        run: docker compose -f deploy/docker-compose.yml up -d --wait --wait-timeout 300
      - name: Check row counts, a second init, roles and ports (acceptance 2, 4, 6)
        run: uv run python -m deploy.check_stack
      - name: Engine tests on the sample data - connector, compiled SQL, golden reference SQL (WP-11, WP-14)
        run: uv run pytest -m engine
        env:
          # Development defaults of the read-only role and the published port (deploy/README.md);
          # they guard a throwaway database, not a secret.
          MAKNA_ENGINE_URL: postgresql://lending_reader:makna_dev_reader@127.0.0.1:5432/lending
          # A missing database must fail this step, never skip every engine test.
          MAKNA_REQUIRE_ENGINE_DATABASE: "1"
      - name: Catalog against the sample database, no differences (WP-11 acceptance 5)
        run: docker compose -f deploy/docker-compose.yml exec -T app makna catalog compare
      - name: Search with the real embedding model, latency and ranking (WP-07 acceptance 8)
        run: docker compose -f deploy/docker-compose.yml exec -T app python -m deploy.check_search
      - name: Show service logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
      # The same image on a network with no route out (internal: true), as a stack of its own:
      # init builds the index, then the CLI and the checks run with the model baked into the
      # image (NFR-3, WP-07 acceptance 9).
      - name: Start the stack on a network with no internet (acceptance 9)
        run: >
          docker compose -p makna-offline
          -f deploy/docker-compose.yml -f deploy/docker-compose.offline.yml
          up -d --wait --wait-timeout 300
      - name: Index build, search and checks without internet (acceptance 9)
        run: |
          offline="docker compose -p makna-offline -f deploy/docker-compose.yml -f deploy/docker-compose.offline.yml"
          $offline exec -T app makna index build
          $offline exec -T app makna search "pembiayaan bermasalah"
          $offline exec -T app python -m deploy.check_search --require-offline
      - name: Show offline service logs
        if: failure()
        run: >
          docker compose -p makna-offline
          -f deploy/docker-compose.yml -f deploy/docker-compose.offline.yml logs --no-color
      - name: Stop the offline stack
        if: always()
        run: >
          docker compose -p makna-offline
          -f deploy/docker-compose.yml -f deploy/docker-compose.offline.yml down -v
