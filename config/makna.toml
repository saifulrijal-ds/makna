# Non-secret settings. Secrets and connection settings come from MAKNA_* environment variables.

dialect = "postgres"

# Embedding provider: fastembed (default), ollama, openai_compatible, or hash (tests only).
# MAKNA_EMBEDDING_PROVIDER overrides it. An API key for openai_compatible comes only from
# MAKNA_EMBEDDING_API_KEY.
embedding_provider = "fastembed"

# Search fusion (ARCHITECTURE 8.2): score = (w_keyword / (60 + keyword rank) +
# w_vector / (60 + vector rank)) * status weight * kind weight. Only the ratio of the two weights
# matters. Chosen again in WP-14C by `python -m evals tune` on the tuned split only (the golden and
# search questions; the held-out questions are never read by the tuning), with the default
# embedding model, by the rule in evals/tune.py and docs/EVALS.md section 7: the keyword list is
# still the stronger one, so the vector list weighs 1/8 of it (WP-15 had 1/16). It ranks what has
# no keyword hit and breaks ties between close keyword ranks.
[search]
w_keyword = 1.0
w_vector = 0.125
candidates = 30

# Status and kind weights are tie-breakers, not tiers (review finding C-3, WP-15D). Fused scores
# of neighbouring ranks differ by only 1 to 2 percent and ranks 1 and 30 of one list by a factor
# of 0.68, so a weight below 0.68 puts the best match of a kind below every candidate of a heavier
# kind, and one of 0.8 below about the first ten to fifteen: with the former 0.8 for dimensions, a search for "region" listed six metrics that
# only mention a region before `dimension:branch.region_name`, which is first in both lists. Every
# weight is therefore between 0.9 and 1.0 and moves a hit by at most a few ranks. Metrics keep
# 1.0 because they are what most questions ask for; a glossary term, an entity, a dimension, and a
# rule lose 4 percent, so that a metric that matches as well as one of them comes first; a domain
# loses 6 percent and a raw catalog column 8 percent (columns are only searched when asked for).
[search.status_weights]
approved = 1.0
deprecated = 1.0   # shown only when the caller asks for deprecated objects; the hit carries its status
draft = 0.95       # shown only to curators, approvers, and admins
in_review = 0.95

[search.kind_weights]
metric = 1.0
glossary_term = 0.96
entity = 0.96
dimension = 0.96
rule = 0.96
domain = 0.94
column = 0.92

# Confidence band (ARCHITECTURE 8.3). low_cosine stays unset: with the default model the top
# cosine of the three golden questions that have no definition (0.43 to 0.51) lies inside that of
# the answer questions (0.27 to 0.65), so it cannot separate them (WP-15, docs/EVALS.md
# "Tuning (WP-15)").
[search.confidence]
high = 0.6
low = 0.2

[embedding.fastembed]
model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
# The Docker image downloads the model here at build time; MAKNA_EMBEDDING_CACHE_DIR overrides it.
cache_dir = "/opt/makna/models"
# false: use only the files in cache_dir and never try the network (NFR-3).
allow_download = false

[embedding.ollama]
url = "http://localhost:11434"
model = "bge-m3"

[embedding.openai_compatible]
url = "https://api.openai.com/v1"
model = "text-embedding-3-small"

[embedding.hash]
dimension = 256

# Personal-data guardrails (ARCHITECTURE 7.6, D-29). The mode applies to the whole deployment and
# only this file sets it: no request, user, or token can change it. `makna validate` always checks
# definitions as in "strict", so definitions stay portable between deployments.
[governance]
team = "data-governance"
# "strict" (default): every protection applies. "custom": relax only the rules set below.
# "off": relax every rule. When the policy relaxes at least one rule, every compile response
# carries a warning that names the mode and each relaxed rule ("custom" with nothing relaxed has
# none). With allow_personal_filters, the minimum group size does not apply to filters.
mode = "strict"
# Groups built from fewer than this many records of the entity holding a personal dimension are
# left out. Allowed in "strict" (at least 2) and "custom" (0 turns the rule off, otherwise at
# least 2). Ignored in "off". 1 and negative numbers are errors.
min_group_size = 10
# The next three are rules of mode "custom" only; setting one in another mode is an error.
# The values shown are the strict ones. Set one only together with mode = "custom"; a rule left
# out keeps its strict value.
# allow_personal_filters = false    # true: filters on personal dimensions (and time ranges on a
#                                   #       personal official date) are allowed
# apply_masks = true                # false: a personal dimension with a masking rule returns the
#                                   #        raw value
# allow_unmasked_personal = false   # true: a personal dimension with no masking rule may be
#                                   #       selected and returns the raw value

# The engine connector (freshness check, catalog compare). MAKNA_ENGINE_URL holds the read-only
# connection URL. A query that runs longer than this is cancelled by the engine and reported as
# an error. 30 seconds is ample for the one MAX() the freshness check runs on an indexed or
# partitioned fact table, and short enough that a refresh over every measure cannot hang on a
# table that is being rebuilt. Raise it for a very large table without a usable index.
[engine]
statement_timeout_seconds = 30

# The MCP endpoint at /mcp (ARCHITECTURE section 12). The server answers only to Host headers of
# localhost, 127.0.0.1, and [::1] (any port), which defeats DNS rebinding. List here every other
# name the application is reached by, as a client writes it in its URL: bare host names, or
# host:port. No scheme, path, or wildcard. Inside the development stack the name is "app".
[mcp]
# allowed_hosts = ["makna.example.org"]

# The web pages (ARCHITECTURE section 13). development = true leaves the Secure flag off the session
# cookie, because the development stack is served over plain http:// and a browser does not send a
# Secure cookie back over it. Never set it for a deployment behind https. MAKNA_WEB_DEVELOPMENT
# (true or false) overrides it.
[web]
development = false

[sensitivity.tag_map]
"PII.Sensitive" = "personal"
"PersonalData.Personal" = "personal"
"PII.NonSensitive" = "confidential"
